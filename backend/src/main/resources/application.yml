spring:
  application:
    name: aifb-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aifb}
    username: ${DB_USER:aifb}
    password: ${DB_PASSWORD:aifb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:9090}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

aifb:
  security:
    jwt:
      # Base64-encoded secret. Override via APP_JWT_SECRET in every non-dev env.
      secret: ${APP_JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1wbGVhc2UtdXNlLWEtcmVhbGx5LWxvbmctYmFzZTY0LXNlY3JldA==}
      issuer: aifb-platform
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    cors:
      allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8081}
  verification:
    code-ttl: PT15M
    password-reset-ttl: PT30M
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    dev-mode: ${GOOGLE_DEV_MODE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger
